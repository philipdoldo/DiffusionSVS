
[training]
train_data_path = "/home/phil/DiffSinger/binarized_data/train.h5"
rng_seed = 21

[training.diffusion]
beta_min = 1e-4
beta_max = 0.06
T = 100
k = 100 # the intersection point used in Algorithm 1 of DiffSinger, could use e.g. k=40 or try predicting k

[training.loss]
l1_weight = 1

[model]
model_type = "EncoderDecoder"

pad_token_id = 0 # maybe add a sanity check in training code that it matches with the vocab.json from the dataset that you end up loading
vocab_size = 60

dilation_cycle_length = 4 # for wavenet
num_wavenet_layers = 20
sinusoidal_base = 10000

num_mel_bins = 80
embedding_dim = 256

num_blocks = 6 # for decoder and encoder I guess
num_attention_heads = 2 # yes, this is what they used
